name: Update template catalog
on:
  schedule:
    - cron: "30 23 * * *" # 07:30 Asia/Shanghai; independent of website deployment.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-template-catalog
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm catalog:update
      - id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/data/template-catalog.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true'
        run: pnpm test && pnpm typecheck && pnpm build
      - if: steps.changes.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/data/template-catalog.json
          git commit -m 'chore: refresh verified template catalog'
          git push origin "HEAD:${DEFAULT_BRANCH}"
      - name: Publish the refreshed catalog snapshot
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run check.yml --ref "$DEFAULT_BRANCH"
